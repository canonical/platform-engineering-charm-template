name: Comment on the pull request

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

jobs:
  comment-on-pr:
    uses: canonical/operator-workflows/.github/workflows/comment.yaml@1be2f1c4d3f3852a02b9e31582960ee4323f93e5  # main
    permissions:
      pull-requests: write
      actions: read
    secrets: inherit
