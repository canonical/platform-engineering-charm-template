name: Comment on the pull request

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

jobs:
  comment-on-pr:
    uses: canonical/operator-workflows/.github/workflows/comment.yaml@3046da45237aa86dcdcd83c299e1380842b473cc  # main
    permissions:
      pull-requests: write
      actions: read
    secrets: inherit
