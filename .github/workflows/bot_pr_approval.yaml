name: Provide approval for bot PRs

on:
  pull_request:

jobs:
  bot_pr_approval:
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    uses: canonical/operator-workflows/.github/workflows/bot_pr_approval.yaml@948386e20781573f08d9ccab0b9b09a772aa29f1  # main
    permissions:
      pull-requests: write
    secrets: inherit

