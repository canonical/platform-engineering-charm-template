name: Provide approval for bot PRs

on:
  pull_request:

jobs:
  bot_pr_approval:
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    uses: canonical/operator-workflows/.github/workflows/bot_pr_approval.yaml@5445ca229f0dc6621e1bdab7e4f792a1dfb2a54b  # main
    permissions:
      pull-requests: write
    secrets: inherit

