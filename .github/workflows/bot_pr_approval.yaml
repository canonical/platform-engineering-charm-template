name: Provide approval for bot PRs

on:
  pull_request:

jobs:
  bot_pr_approval:
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    uses: canonical/operator-workflows/.github/workflows/bot_pr_approval.yaml@543b9f18f9ccf70d00f3638943c8ca2dc265f129  # main
    permissions:
      pull-requests: write
    secrets: inherit

