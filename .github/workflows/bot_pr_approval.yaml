name: Provide approval for bot PRs

on:
  pull_request:

jobs:
  bot_pr_approval:
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    uses: canonical/operator-workflows/.github/workflows/bot_pr_approval.yaml@7872f6006323a38a3384052e39698ebfd7edfbb9  # main
    permissions:
      pull-requests: write
    secrets: inherit

