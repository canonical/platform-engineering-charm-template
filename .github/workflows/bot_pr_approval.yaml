name: Provide approval for bot PRs

on:
  pull_request:

jobs:
  bot_pr_approval:
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    uses: canonical/operator-workflows/.github/workflows/bot_pr_approval.yaml@95c819190372baf8338f3ed15b80ba76ec881136  # main
    permissions:
      pull-requests: write
    secrets: inherit

