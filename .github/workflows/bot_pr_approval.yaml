name: Provide approval for bot PRs

on:
  pull_request:

jobs:
  bot_pr_approval:
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    uses: canonical/operator-workflows/.github/workflows/bot_pr_approval.yaml@0c8c3b8ab7c826146cb058bd73b62887e3b31944  # main
    permissions:
      pull-requests: write
    secrets: inherit

