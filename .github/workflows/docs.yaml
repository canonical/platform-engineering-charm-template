name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  docs-checks:
    uses: canonical/operator-workflows/.github/workflows/docs.yaml@3046da45237aa86dcdcd83c299e1380842b473cc  # main
    permissions:
      contents: read
    secrets: inherit
    with:
      vale-files: '["README.md","CONTRIBUTING.md","docs/"]'
      linkcheck-fail-on-error: false

