name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  docs-checks:
    uses: canonical/operator-workflows/.github/workflows/docs.yaml@1be2f1c4d3f3852a02b9e31582960ee4323f93e5  # main
    permissions:
      contents: read
    secrets: inherit
    with:
      vale-files: '["README.md","CONTRIBUTING.md","docs/"]'
      linkcheck-fail-on-error: false

