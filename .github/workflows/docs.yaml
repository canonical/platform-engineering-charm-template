name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  docs-checks:
    uses: canonical/operator-workflows/.github/workflows/docs.yaml@c81a9cdd5acfba473f2f52a4cfbeed7132062df1  # main
    permissions:
      contents: read
    secrets: inherit
    with:
      vale-files: '["README.md","CONTRIBUTING.md","docs/"]'
      linkcheck-fail-on-error: false

