name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  docs-checks:
    uses: canonical/operator-workflows/.github/workflows/docs.yaml@ee6ae1904efb4732afd72f8f261cddf445ff07fc  # main
    permissions:
      contents: read
    secrets: inherit
    with:
      vale-files: '["README.md","CONTRIBUTING.md","docs/"]'
      linkcheck-fail-on-error: false

