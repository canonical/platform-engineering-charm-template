name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  docs-checks:
    uses: canonical/operator-workflows/.github/workflows/docs.yaml@5dbf925ede6288e3b7759114da363bcadada5f1f  # main
    permissions:
      contents: read
    secrets: inherit
    with:
      vale-files: '["README.md","CONTRIBUTING.md","docs/"]'
      linkcheck-fail-on-error: false

