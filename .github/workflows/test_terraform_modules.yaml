name: Terraform modules tests

# Keep the `paths` filters below in sync with `terraform-directories`. For repos with
# nested `terraform/` directories use `**/terraform/**` or explicit globs instead.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/test_terraform_modules.yaml'

jobs:
  terraform-tests:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@948386e20781573f08d9ccab0b9b09a772aa29f1  # main
    permissions:
      contents: read
    secrets: inherit
    with:
      k8s-controller: true
      #lxd-controller: true
      terraform-directories: '["terraform/charm"]'
