name: Terraform modules tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/test_terraform_modules.yaml'

jobs:
  terraform-tests:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@95c819190372baf8338f3ed15b80ba76ec881136  # main
    permissions:
      contents: read
    secrets: inherit
    with:
      k8s-controller: true
      #lxd-controller: true
      terraform-directories: '["terraform/charm"]'
