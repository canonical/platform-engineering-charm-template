name: Terraform modules tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - 'terraform-product/**'
      - '.github/workflows/test_terraform_modules.yaml'

jobs:
  terraform-tests:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@efdd72c768efaca41f992322fa51a830e90f4990  # main
    permissions:
      contents: read
    secrets: inherit
    with:
      k8s-controller: true
      #lxd-controller: true
      terraform-directories: '["terraform"]'
