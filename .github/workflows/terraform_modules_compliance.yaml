name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_compliance.yaml'

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@ee6ae1904efb4732afd72f8f261cddf445ff07fc  # main
    with:
      terraform-directories: '["terraform/charm"]'
