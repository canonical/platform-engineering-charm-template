name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_compliance.yaml'

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@5445ca229f0dc6621e1bdab7e4f792a1dfb2a54b  # main
    with:
      terraform-directories: '["terraform/charm"]'
