name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_compliance.yaml'

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@1305365b01750a3ab472fd285ec6e1902b5377bb  # main
    with:
      terraform-directories: '["terraform/charm"]'
