name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform_modules_compliance.yaml'

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@543b9f18f9ccf70d00f3638943c8ca2dc265f129  # main
    with:
      terraform-directories: '["terraform/charm"]'
