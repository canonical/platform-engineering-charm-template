name: Update Terraform documentation

# Keep the `paths` filters below and the `terraform-directory` input in sync with
# the directory where the Terraform modules live.
on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-docs:
    name: Update Terraform documentation
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@5445ca229f0dc6621e1bdab7e4f792a1dfb2a54b  # main
    secrets: inherit
    with:
      terraform-directory: terraform/charm
