# template-version: 2
# This file is synced from canonical/platform-engineering-charm-template.
# Remove this comment block to opt this file out of automatic template propagation.
# See https://github.com/canonical/gh-jira-sync-bot for config
settings:
  jira_project_key: "ISD"

  status_mapping:
    opened: Untriaged
    closed: done
    not_planned: rejected
    
  add_gh_comment: true

  # Only issues with these labels are synced to Jira (this also avoids syncing "Dependency dashboard" issues).
  # Blank issues are disabled in .github/ISSUE_TEMPLATE/config.yml so that every issue gets one of these labels.
  labels:
  - bug
  - enhancement
  
  label_mapping:
    bug: Bug
    enhancement: Story

  component:
  - <your-component> # Use Jira component name string
